<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuotaHalo</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="panel" aria-live="polite">
      <header class="panel-header" data-tauri-drag-region>
        <h1><img class="brand-mark" src="./brand-icon.png" alt="" />QuotaHalo</h1>
        <span id="timezone" class="timezone">加载时区中</span>
      </header>

      <section id="quota-content" class="quota-content" data-tauri-drag-region>
        <article class="quota-card primary-card">
          <div class="quota-topline">
            <span class="quota-name">Codex · 5 小时额度</span>
            <span id="primary-remaining" class="remaining">—</span>
          </div>
          <div class="progress-track" aria-label="5 小时额度剩余比例">
            <div id="primary-progress" class="progress-fill"></div>
          </div>
          <p class="quota-meta"><strong id="primary-reset" class="reset-time">正在读取</strong><span id="primary-countdown" class="countdown">正在连接本地 Codex 服务</span></p>
        </article>

        <div class="divider"></div>

        <article class="quota-card weekly-card">
          <div class="quota-topline weekly-topline">
            <span class="quota-name">Codex · 每周额度</span>
            <span id="weekly-remaining" class="remaining">—</span>
          </div>
          <div class="progress-track weekly-progress-track" aria-label="每周额度剩余比例">
            <div id="weekly-progress" class="progress-fill"></div>
          </div>
          <p id="weekly-reset" class="weekly-reset">正在读取</p>
        </article>
      </section>

      <section id="error-content" class="error-content" data-tauri-drag-region hidden>
        <p id="error-message"></p>
        <button id="open-usage" class="usage-button" type="button">打开 ChatGPT 用量页面</button>
      </section>

      <section class="credits-content" aria-label="其他服务积分">
        <div class="section-caption"><span>积分账户</span><span class="section-rule"></span></div>
        <article class="credit-row" data-service="workbuddy">
          <span class="service-mark workbuddy-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="2.5"/><circle cx="17" cy="9" r="2"/><path d="M3.5 19v-1.6a5.5 5.5 0 0 1 11 0V19ZM15 14.5a4.5 4.5 0 0 1 5.5 4.5H17"/></svg></span>
          <div class="credit-copy"><strong>WorkBuddy</strong><small id="workbuddy-detail">正在读取</small></div>
          <strong id="workbuddy-remaining" class="credit-value">—</strong>
        </article>
        <article class="credit-row" data-service="trae">
          <span class="service-mark trae-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 5 6 7-6 7M13 19h6"/></svg></span>
          <div class="credit-copy"><strong>TRAE</strong><small id="trae-detail">等待配置</small></div>
          <strong id="trae-remaining" class="credit-value">—</strong>
        </article>
        <article class="credit-row" data-service="qoder">
          <span class="service-mark qoder-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 2 8.5 5v10L12 22l-8.5-5V7ZM3.5 7 12 12l8.5-5M12 12v10"/></svg></span>
          <div class="credit-copy"><strong>Qoder</strong><small id="qoder-detail">等待配置</small></div>
          <strong id="qoder-remaining" class="credit-value">—</strong>
        </article>
      </section>

      <section id="mini-content" class="mini-content" data-tauri-drag-region hidden>
        <div class="mini-ring" aria-label="5 小时额度剩余比例">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle class="mini-ring-track" cx="60" cy="60" r="48" pathLength="100" />
            <circle id="mini-ring-progress" class="mini-ring-progress" cx="60" cy="60" r="48" pathLength="100" />
          </svg>
          <strong id="mini-remaining" class="mini-remaining">—</strong>
        </div>
        <div class="mini-copy">
          <strong id="mini-countdown" class="mini-countdown">正在读取</strong>
          <span id="mini-reset" class="mini-reset">—</span>
        </div>
        <button id="exit-compact" class="mini-exit" type="button" aria-label="退出极简模式" title="退出极简模式">↗</button>
      </section>

      <footer class="panel-footer">
        <span id="updated-at">尚未更新</span>
        <div class="footer-actions">
          <!-- Icons: Lucide (https://github.com/lucide-icons/lucide) -->
          <button id="settings" class="icon-button settings-button" type="button" aria-label="外观设置" title="外观设置" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.51a2 2 0 0 1 1-1.73l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z"/><circle cx="12" cy="12" r="3"/></svg></button>
          <button id="compact-toggle" class="icon-button compact-toggle" type="button" aria-label="切换极简模式" title="切换极简模式"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6"/><path d="m21 3-7 7"/><path d="M9 21H3v-6"/><path d="m3 21 7-7"/></svg></button>
          <button id="refresh" class="icon-button" type="button" aria-label="刷新额度" title="刷新额度"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 0 0-15.19-6.4L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 15.19 6.4L21 16"/><path d="M16 16h5v5"/></svg></button>
        </div>
      </footer>
      <aside id="settings-panel" class="settings-panel" aria-label="连接与外观设置" hidden>
        <p class="settings-title">连接服务</p>
        <p class="settings-hint">登录信息保存在 Windows 凭据管理器，重启后自动恢复。</p>
        <div class="connection-heading"><label class="credential-field" for="qoder-token">Qoder · 中国区 PAT</label><span id="qoder-connection">未连接</span></div>
        <div class="credential-line"><input id="qoder-token" type="password" autocomplete="off" spellcheck="false" placeholder="粘贴 pt- 开头的 PAT" /><button id="save-qoder" type="button">连接</button></div>
        <button id="forget-qoder" class="forget-connection" type="button" hidden>忘记 Qoder 登录</button>
        <div class="connection-heading"><span class="credential-field">TRAE</span><span id="trae-connection">未连接</span></div>
        <div class="credential-line"><button id="login-trae" class="login-service" type="button">打开 TRAE 登录窗口</button></div>
        <div class="credential-line"><input id="trae-secret" type="password" autocomplete="off" spellcheck="false" placeholder="或粘贴 Cloud-IDE-Token" /><button id="save-trae" type="button">连接</button></div>
        <button id="forget-trae" class="forget-connection" type="button" hidden>忘记 TRAE 登录</button>
        <p id="connection-message" class="connection-message" role="status"></p>
        <div class="appearance-divider"></div>
        <p class="settings-title">外观</p>
        <div class="theme-grid">
          <button class="theme-choice" type="button" data-theme="violet"><i></i>紫雾</button>
          <button class="theme-choice" type="button" data-theme="cyan"><i></i>青蓝</button>
          <button class="theme-choice" type="button" data-theme="indigo"><i></i>靛蓝</button>
          <button class="theme-choice" type="button" data-theme="moss"><i></i>墨绿</button>
          <button class="theme-choice" type="button" data-theme="amber"><i></i>琥珀</button>
          <button class="theme-choice" type="button" data-theme="mono"><i></i>灰阶</button>
        </div>
        <div class="appearance-divider"></div>
        <label class="opacity-setting" for="opacity">
          <span>透明度 <output id="opacity-value">100%</output></span>
          <input id="opacity" type="range" min="60" max="100" step="5" value="100" />
        </label>
      </aside>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
