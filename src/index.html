<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuotaHalo</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="panel" aria-live="polite">
      <header class="panel-header" data-tauri-drag-region>
        <div class="header-identity">
          <h1><span>Quota</span><span class="brand-halo">Halo</span></h1>
        </div>
        <div class="header-actions">
          <!-- Icons: Lucide (https://lucide.dev/) -->
          <span id="timezone" class="timezone">UTC</span>
          <button id="minimize" class="icon-button" type="button" aria-label="最小化窗口" title="最小化窗口"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
          <button id="compact-toggle" class="icon-button compact-toggle" type="button" aria-label="进入极简模式" title="进入极简模式"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 10 7-7"/><path d="M20 10h-6V4"/><path d="m3 21 7-7"/><path d="M4 14h6v6"/></svg></button>
          <button id="close-panel" class="icon-button" type="button" aria-label="关闭到托盘" title="关闭到托盘"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>
      </header>

      <section id="quota-content" class="quota-content" data-tauri-drag-region>
        <article class="quota-card primary-card">
          <div class="quota-heading"><span class="quota-name">Codex · 5 小时额度</span></div>
          <div class="primary-body">
            <div id="primary-ring" class="halo-ring" role="progressbar" aria-label="5 小时额度剩余" aria-valuemin="0" aria-valuemax="100" aria-valuetext="尚未读取">
              <svg viewBox="0 0 120 120" aria-hidden="true">
                <circle class="halo-ring-track" cx="60" cy="60" r="49" pathLength="100" />
                <circle id="primary-progress" class="halo-ring-progress" cx="60" cy="60" r="49" pathLength="100" />
              </svg>
              <span class="halo-ring-center"><strong id="primary-remaining">—</strong><small>剩余</small></span>
            </div>
            <div class="primary-details">
              <span class="detail-label">距离重置还剩</span>
              <strong id="primary-countdown" class="countdown">正在读取</strong>
              <span id="primary-reset" class="reset-time">—</span>
            </div>
          </div>
        </article>

        <div class="divider"></div>

        <article class="quota-card weekly-card">
          <div class="quota-topline weekly-topline">
            <span class="quota-name">Codex · 每周额度</span>
            <span id="weekly-remaining" class="remaining">—</span>
          </div>
          <div class="progress-track weekly-progress-track" aria-label="每周额度剩余比例">
            <div id="weekly-progress" class="progress-fill"></div>
          </div>
          <p id="weekly-reset" class="weekly-reset">正在读取</p>
        </article>
      </section>

      <section id="error-content" class="error-content" data-tauri-drag-region hidden>
        <p id="error-message"></p>
        <button id="open-usage" class="usage-button" type="button">打开 ChatGPT 用量页面</button>
      </section>

      <section class="credits-content" aria-label="其他服务积分">
        <div class="section-caption"><span>积分账户</span><span class="section-rule"></span></div>
        <article class="credit-row" data-service="workbuddy">
          <span class="service-mark workbuddy-mark" aria-hidden="true"><img src="./workbuddy.svg" alt="" /></span>
          <div class="credit-copy"><strong>WorkBuddy</strong><small id="workbuddy-detail">正在读取</small></div>
          <strong id="workbuddy-remaining" class="credit-value">—</strong>
        </article>
        <article class="credit-row" data-service="trae">
          <span class="service-mark trae-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M24 20.5H3.5V17H0V3.5h24ZM3.5 17h17V7h-17Zm8.5-5-2.5 2.5L7 12l2.5-2.5Zm7 0-2.5 2.5L14 12l2.5-2.5z"/></svg></span>
          <div class="credit-copy"><strong>TRAE</strong><small id="trae-detail">等待配置</small></div>
          <strong id="trae-remaining" class="credit-value">—</strong>
        </article>
        <article class="credit-row" data-service="qoder">
          <span class="service-mark qoder-mark" aria-hidden="true"></span>
          <div class="credit-copy"><strong>Qoder</strong><small id="qoder-detail">等待配置</small></div>
          <strong id="qoder-remaining" class="credit-value">—</strong>
        </article>
      </section>

      <section id="mini-content" class="mini-content" data-tauri-drag-region hidden>
        <div id="mini-ring" class="halo-ring mini-ring" role="progressbar" aria-label="5 小时额度剩余" aria-valuemin="0" aria-valuemax="100" aria-valuetext="尚未读取">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle class="halo-ring-track" cx="60" cy="60" r="49" pathLength="100" />
            <circle id="mini-ring-progress" class="halo-ring-progress" cx="60" cy="60" r="49" pathLength="100" />
          </svg>
          <strong id="mini-remaining" class="mini-remaining">—</strong>
        </div>
        <div class="mini-copy">
          <strong id="mini-countdown" class="mini-countdown">正在读取</strong>
          <span id="mini-reset" class="mini-reset">—</span>
        </div>
        <div class="mini-actions">
          <button id="mini-close-panel" class="mini-exit" type="button" aria-label="关闭到托盘" title="关闭到托盘"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
          <button id="exit-compact" class="mini-exit" type="button" aria-label="恢复完整模式" title="恢复完整模式"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13 13h5v-5M3 3l6 6m12 12-6-6"/></svg></button>
        </div>
      </section>

      <footer class="panel-footer">
        <span id="updated-at">尚未更新</span>
        <div class="footer-actions">
          <!-- Icons: Lucide (https://github.com/lucide-icons/lucide) -->
          <button id="settings" class="icon-button settings-button" type="button" aria-label="外观设置" title="外观设置" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.51a2 2 0 0 1 1-1.73l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z"/><circle cx="12" cy="12" r="3"/></svg></button>
          <button id="refresh" class="icon-button" type="button" aria-label="刷新额度" title="刷新额度"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 0 0-15.19-6.4L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 15.19 6.4L21 16"/><path d="M16 16h5v5"/></svg></button>
        </div>
      </footer>
      <section id="settings-panel" class="settings-panel" aria-label="连接与外观设置" hidden>
        <header class="settings-header" data-tauri-drag-region>
          <button id="settings-back" class="icon-button" type="button" aria-label="返回额度概览" title="返回额度概览"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/><path d="M9 12h11"/></svg></button>
          <h2>设置</h2>
          <span aria-hidden="true"></span>
        </header>
        <div class="settings-content">
          <section class="settings-group" aria-labelledby="connection-title">
            <div class="settings-group-heading"><div><h3 id="connection-title">连接服务</h3><p>登录信息仅保存在 Windows 凭据管理器。</p></div></div>
            <article class="connection-card" data-connection="qoder">
              <div class="connection-heading"><div><h4>Qoder</h4><p>中国区 PAT</p></div><span id="qoder-connection" class="connection-status">未连接</span></div>
              <label class="credential-field" for="qoder-token">个人访问令牌</label>
              <div class="credential-line"><input id="qoder-token" type="password" autocomplete="off" spellcheck="false" placeholder="粘贴 pt- 开头的 PAT" /><button id="save-qoder" type="button">连接</button></div>
              <p id="qoder-message" class="connection-message" role="status"></p>
              <button id="forget-qoder" class="forget-connection" type="button" hidden>忘记此登录</button>
            </article>
            <article class="connection-card" data-connection="trae">
              <div class="connection-heading"><div><h4>TRAE</h4><p>可网页登录或手动粘贴 Token</p></div><span id="trae-connection" class="connection-status">未连接</span></div>
              <button id="login-trae" class="login-service" type="button">打开 TRAE 登录窗口</button>
              <p class="connection-or">或使用已有凭据</p>
              <label class="credential-field" for="trae-secret">Cloud-IDE-Token</label>
              <div class="credential-line"><input id="trae-secret" type="password" autocomplete="off" spellcheck="false" placeholder="粘贴 Cloud-IDE-Token" /><button id="save-trae" type="button">连接</button></div>
              <p id="trae-message" class="connection-message" role="status"></p>
              <button id="forget-trae" class="forget-connection" type="button" hidden>忘记此登录</button>
            </article>
          </section>
          <section class="settings-group" aria-labelledby="appearance-title">
            <div class="settings-group-heading"><div><h3 id="appearance-title">外观</h3><p>选择皮肤与窗口透明度。</p></div></div>
            <div class="appearance-card">
              <span class="setting-label">皮肤</span>
              <div id="theme-options" class="theme-grid">
                <button class="theme-choice" type="button" data-theme="violet"><i></i>紫晶</button>
                <button class="theme-choice" type="button" data-theme="blue"><i></i>湛蓝</button>
                <button class="theme-choice" type="button" data-theme="mint"><i></i>青绿</button>
                <button class="theme-choice" type="button" data-theme="amber"><i></i>琥珀</button>
              </div>
              <label class="opacity-setting" for="opacity"><span>透明度 <output id="opacity-value">100%</output></span><input id="opacity" type="range" min="60" max="100" step="5" value="100" /></label>
            </div>
          </section>
        </div>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
